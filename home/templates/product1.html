{%extends "base.html"%}
{%load static%}
     
{%block content%}
        
        <!-- page-title -->
        <div class="page-title" style="background-image:url({% static 'images/slider/slider-jewelry2.jpg' %});">
            <div class="container-full">
                <div class="row">
                    <div class="col-12">
                      
                        <ul class="breadcrumbs d-flex align-items-center justify-content-center">
                            <li>
                                <a class="link" href="{%url "home"%}">Homepage</a>
                            </li>
                            <li>
                                <i class="icon-arrRight"></i>
                            </li>
                            <li>
                                Women
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <!-- /page-title -->
        <!-- Section product -->
        <section class="flat-spacing">
            <div class="container">
                <div class="tf-shop-control">
                    <div class="tf-control-filter">
                        <a href="#filterShop" data-bs-toggle="offcanvas" aria-controls="filterShop" class="tf-btn-filter"><span class="icon icon-filter"></span><span class="text">Filters</span></a>
                        <div class="d-none d-lg-flex shop-sale-text">
                            <i class="icon icon-checkCircle"></i>
                            <p class="text-caption-1">Shop sale items only</p>
                        </div>
                    </div>
                    
                   
                </div>
                <div class="wrapper-control-shop">
                    <div class="meta-filter-shop">
                        <div id="product-count-grid" class="count-text"></div>
                        <div id="product-count-list" class="count-text"></div>
                        <div id="applied-filters"></div>
                        <button id="remove-all" class="remove-all-filters text-btn-uppercase" style="display: none;">REMOVE ALL <i class="icon icon-close"></i></button>
                    </div>
                    
                    <div class="tf-grid-layout wrapper-shop tf-col-4" id="gridLayout">
                        {% for item in products %}
                        <!-- card product -->
                        <div class="card-product grid" data-availability="{{ item.availability }}" data-brand="{{ item.brand }}">
                            <div class="card-product-wrapper">
                                <a href="{% url 'productDetail' item.slug %}" class="product-img">
                                    <img class="lazyload img-product" src="{{ item.image.url }}" alt="image-product">
                                    <img class="lazyload img-hover"  src="{{ item.image.url }}" alt="image-product">
                                </a>
                                {% if item.on_sale %}
                                    <div class="on-sale-wrap"><span class="on-sale-item">-{{ item.discount_percentage }}%</span></div>
                                {% endif %}
                                <div class="list-product-btn">
                                    <a href="{% url 'add_to_wishlist' item.id %}" class="box-icon wishlist btn-icon-action">
                                        <span class="icon icon-heart"></span>
                                        <span class="tooltip">Wishlist</span>
                                    </a>
                                    
                                    <a href="#quickView" data-bs-toggle="modal" class="box-icon quickview tf-btn-loading">
                                        <span class="icon icon-eye"></span>
                                        <span class="tooltip">Quick View</span>
                                    </a>
                                </div>
                                <div class="list-btn-main">
                                    <a href="{% url 'add_to_cart' item.id %}"  class="btn-main-product">Add To cart</a>
                                </div>
                            </div>
                            <div class="card-product-info">
                                <a href="/product/{{product.slug}}" class="title link">{{ item.name }}</a>
                                <span class="price current-price">₹{{ item.price }}</span>
                            </div>
                        </div>
                    {% endfor %}
                    </div>

                    
                </div>
            </div>
        </section>
        <!-- /Section product -->
        <!-- tf-has-purchased -->
       
   
{%endblock%}
